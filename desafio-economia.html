<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafio de Economia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFE3;
    --card-bg:#F7F5EA;
    --ink:#1F3A2E;
    --ink-soft:#57685C;
    --border:#C9C3AE;
    --gold:#B8863B;
    --gold-light:#E4C77E;
    --stamp:#A23B2E;
    --done-bg:#DCE3D2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    padding:32px 20px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px,5vw,46px);
    margin:0 0 4px;
    line-height:1.05;
  }
  .sub{color:var(--ink-soft);font-size:15px;margin:0;}

  .config{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin:22px 0 26px;
    align-items:flex-end;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
  }
  .field input{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:3px;
    background:var(--card-bg);
    color:var(--ink);
    width:140px;
  }
  .field input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  button{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    font-size:14px;
    padding:10px 16px;
    border-radius:3px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  button.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--border);
  }
  button:hover{opacity:.88;}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .ledger{
    border:1px solid var(--border);
    background:var(--card-bg);
    border-radius:4px;
    padding:18px 20px;
    margin-bottom:30px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px 20px;
  }
  .ledger-row{display:contents;}
  .ledger-label{font-size:13px;color:var(--ink-soft);align-self:center;}
  .ledger-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    text-align:right;
    align-self:center;
  }
  .ledger-value.big{
    font-size:22px;
    font-weight:600;
    color:var(--gold);
  }
  .bar-row{grid-column:1/-1;margin-top:6px;}
  .bar-track{
    height:10px;
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--gold-light));
    width:0%;
    transition:width .4s ease;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:10px;
  }
  .card{
    position:relative;
    border:1px dashed var(--border);
    background:var(--card-bg);
    border-radius:4px;
    padding:14px 8px 12px;
    text-align:center;
    cursor:pointer;
    overflow:hidden;
    user-select:none;
    transition:background .15s ease,border-color .15s ease,transform .1s ease;
  }
  .card:hover{border-color:var(--gold);transform:translateY(-1px);}
  .card .val{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:15px;
  }
  .card .cifrao{font-size:10px;color:var(--ink-soft);display:block;margin-bottom:2px;}
  .card.done{
    background:var(--done-bg);
    border-style:solid;
    border-color:var(--ink);
  }
  .card.done .val{opacity:.55;text-decoration:line-through;}
  .stamp{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(-16deg);
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:12px;
    letter-spacing:.06em;
    color:var(--stamp);
    border:2px solid var(--stamp);
    border-radius:3px;
    padding:2px 6px;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .card.done .stamp{opacity:.85;transform:translate(-50%,-50%) rotate(-16deg) scale(1);}

  footer{
    margin-top:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }
  .msg{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .loading{color:var(--ink-soft);font-size:14px;padding:40px 0;text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Caderneta de metas</div>
    <h1 id="titulo">Desafio dos R$ 150.000</h1>
    <p class="sub">Marque um valor sempre que conseguir guardar aquela quantia. A soma de todos fecha na sua meta.</p>
  </header>

  <div class="config">
    <div class="field">
      <label for="goalInput">Meta (R$)</label>
      <input id="goalInput" type="number" min="100" step="100" value="150000">
    </div>
    <div class="field">
      <label for="countInput">Quantidade de células</label>
      <input id="countInput" type="number" min="10" max="300" step="1" value="150">
    </div>
    <button id="regenBtn">Gerar nova tabela</button>
    <button id="resetBtn" class="secondary">Reiniciar marcações</button>
  </div>

  <div class="ledger">
    <div class="ledger-row">
      <div class="ledger-label">Meta total</div>
      <div class="ledger-value" id="lblGoal">R$ 0</div>
    </div>
    <div class="ledger-row">
      <div class="ledger-label">Já guardado</div>
      <div class="ledger-value big" id="lblSaved">R$ 0</div>
    </div>
    <div class="ledger-row">
      <div class="ledger-label">Falta</div>
      <div class="ledger-value" id="lblLeft">R$ 0</div>
    </div>
    <div class="ledger-row">
      <div class="ledger-label"><span id="lblPct">0%</span> concluído · <span id="lblCount">0/0</span> células marcadas</div>
      <div></div>
    </div>
    <div class="bar-row">
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </div>

  <div id="gridArea"><div class="loading">Carregando sua tabela…</div></div>

  <footer>
    <span class="msg" id="saveStatus">Progresso salvo automaticamente neste navegador.</span>
  </footer>

</div>

<script>
const STORAGE_KEY = 'desafio-economia-state';
let state = null; // { goal, count, values:[...], checked:[bool...] }

function fmtBRL(n){
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2});
}

// Gera N valores positivos, arredondados em múltiplos de 5, que somam exatamente `goal`.
function generateValues(goal, n){
  const cuts = [0, goal];
  for(let i=0;i<n-1;i++){
    cuts.push(Math.random()*goal);
  }
  cuts.sort((a,b)=>a-b);
  let raw = [];
  for(let i=1;i<cuts.length;i++){
    raw.push(cuts[i]-cuts[i-1]);
  }
  // arredonda para múltiplos de 5, garante mínimo de 5
  let rounded = raw.map(v => Math.max(5, Math.round(v/5)*5));
  let diff = goal - rounded.reduce((a,b)=>a+b,0);
  // ajusta a diferença de arredondamento na maior célula
  let idxMax = rounded.indexOf(Math.max(...rounded));
  rounded[idxMax] = Math.max(5, rounded[idxMax] + diff);
  // embaralha a ordem de exibição
  for(let i=rounded.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [rounded[i],rounded[j]]=[rounded[j],rounded[i]];
  }
  return rounded;
}

function newState(goal, count){
  return {
    goal, count,
    values: generateValues(goal, count),
    checked: new Array(count).fill(false)
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){
    console.log('Nada salvo ainda ou erro ao ler:', e);
  }
  return null;
}

let saveTimer = null;

function setSaveStatus(text){
  const el = document.getElementById('saveStatus');
  if(el) el.textContent = text;
}

function saveNow(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setSaveStatus('Progresso salvo neste navegador.');
  }catch(e){
    console.error('Falha ao salvar progresso:', e);
    setSaveStatus('Não foi possível salvar. O navegador pode estar com o armazenamento cheio ou bloqueado.');
  }
}

// Agrupa cliques rápidos em uma única gravação.
function saveState(){
  if(saveTimer) clearTimeout(saveTimer);
  setSaveStatus('Salvando…');
  saveTimer = setTimeout(saveNow, 300);
}

function renderGrid(){
  const grid = document.createElement('div');
  grid.className = 'grid';
  state.values.forEach((val, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (state.checked[i] ? ' done' : '');
    card.setAttribute('role','checkbox');
    card.setAttribute('aria-checked', state.checked[i] ? 'true' : 'false');
    card.tabIndex = 0;
    card.innerHTML = `<span class="cifrao">guardar</span><span class="val">${fmtBRL(val)}</span><span class="stamp">GUARDADO</span>`;
    const toggle = () => {
      state.checked[i] = !state.checked[i];
      card.classList.toggle('done', state.checked[i]);
      card.setAttribute('aria-checked', state.checked[i] ? 'true' : 'false');
      updateSummary();
      saveState();
    };
    card.addEventListener('click', toggle);
    card.addEventListener('keydown', (e) => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
    grid.appendChild(card);
  });
  const area = document.getElementById('gridArea');
  area.innerHTML = '';
  area.appendChild(grid);
}

function updateSummary(){
  const savedSum = state.values.reduce((sum,v,i)=> sum + (state.checked[i] ? v : 0), 0);
  const checkedCount = state.checked.filter(Boolean).length;
  const pct = state.goal > 0 ? Math.min(100, (savedSum/state.goal)*100) : 0;
  document.getElementById('titulo').textContent = `Desafio dos ${fmtBRL(state.goal)}`;
  document.getElementById('lblGoal').textContent = fmtBRL(state.goal);
  document.getElementById('lblSaved').textContent = fmtBRL(savedSum);
  document.getElementById('lblLeft').textContent = fmtBRL(Math.max(0, state.goal - savedSum));
  document.getElementById('lblPct').textContent = pct.toFixed(1) + '%';
  document.getElementById('lblCount').textContent = `${checkedCount}/${state.count}`;
  document.getElementById('barFill').style.width = pct + '%';
}

function init(){
  const saved = loadState();
  if(saved && saved.values && saved.values.length){
    state = saved;
    document.getElementById('goalInput').value = state.goal;
    document.getElementById('countInput').value = state.count;
  } else {
    state = newState(150000, 150);
    saveNow();
  }
  renderGrid();
  updateSummary();
}

document.getElementById('regenBtn').addEventListener('click', () => {
  const goal = Math.max(100, Number(document.getElementById('goalInput').value) || 150000);
  const count = Math.min(300, Math.max(10, Number(document.getElementById('countInput').value) || 150));
  if(state && state.checked.some(Boolean)){
    const ok = confirm('Gerar uma nova tabela vai apagar as marcações atuais. Continuar?');
    if(!ok) return;
  }
  state = newState(goal, count);
  saveNow();
  renderGrid();
  updateSummary();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if(!state) return;
  const ok = confirm('Isso vai desmarcar todas as células (os valores continuam os mesmos). Continuar?');
  if(!ok) return;
  state.checked = new Array(state.count).fill(false);
  saveNow();
  renderGrid();
  updateSummary();
});

init();
</script>
</body>
</html>
